<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Gym Progress" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <link rel="icon" href="./icons/favicon-64.png" />
  <link rel="preload" as="image" href="./finish-celebration.png" fetchpriority="high" />
  <link rel="stylesheet" href="./styles.css?v=1.5.14" />
  <title>Gym Progress</title>
</head>
<body>
  <div id="app"></div>
  <div id="status-root" aria-live="polite" aria-atomic="true"></div>
  <div id="dialog-root"></div>
  <script>
    window.addEventListener('error', function (event) {
      const app=document.getElementById('app');
      if(app && !app.innerHTML.trim()) app.innerHTML='<div style="padding:24px;color:#fff;font:16px system-ui"><h1 style="font-size:24px">Gym Progress</h1><p>App files did not load correctly. Open recovery.html from the same site or reload after the deployment finishes.</p><pre style="white-space:pre-wrap;color:#f2b8b5">'+String(event.message||'Module load error').replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})+'</pre></div>';
    }, true);
  </script>
  <script type="module" src="./app.js?v=1.5.14"></script>
</body>
</html>
